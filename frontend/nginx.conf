# Se davanti c'e' NPM (HTTPS) il proto arriva in X-Forwarded-Proto: serve per il cookie Secure di Strapi.
map $http_x_forwarded_proto $pulse_proto { default $scheme; https https; }
server {
 listen 80;
 server_name _;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 128k;
 access_log off;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
 location / { try_files $uri $uri/ /index.html; }
 # APIs are never cached. In production Caddy routes /api/pulse directly to Strapi.
 # Come faceva Caddy: dall'esterno passa SOLO /api/pulse/*, il resto di /api/ e' 404.
 location /api/pulse/ {
  client_max_body_size 128k;
  proxy_pass http://strapi:1337;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $pulse_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
 }
 location /api/ { return 404; }
 location /admin { return 404; }
 location /uploads { return 404; }
 location = /sw.js { expires -1; }
 location = /index.html { expires -1; }
 location = /manifest.webmanifest { expires -1; }
 location ~ /\. { deny all; }
 location = /health { access_log off; return 200 "ok"; }
}
