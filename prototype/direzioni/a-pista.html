<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direzione A · Pista</title>
<style>
/* Direzione A "Pista": sportiva, editoriale, alto contrasto. Lime elettrico su inchiostro, numeri condensati. */
:root{--bg:#f2f2ee;--card:#fff;--ink:#111312;--mut:#5b605c;--line:#d9dbd4;--acc:#c6f135;--accInk:#111312;--on:#ff4d2e;--off:#2f6bff}
[data-theme=dark]{--bg:#0b0c0b;--card:#161816;--ink:#f1f3ee;--mut:#a3a8a1;--line:#2a2d29}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Inter","Segoe UI",system-ui,sans-serif}
.num{font-family:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow",sans-serif;font-stretch:condensed;font-weight:700;letter-spacing:-.02em}
.wrap{max-width:420px;margin:auto;padding:20px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center}
.kick{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
h1{font-size:44px;line-height:.95;margin:6px 0 18px;text-transform:uppercase}
h1 span{background:var(--acc);color:var(--accInk);padding:0 6px}
.chip{min-height:44px;border:2px solid var(--ink);background:none;color:var(--ink);border-radius:0;padding:0 14px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.chip b{color:var(--on)}
.hero{background:var(--ink);color:var(--bg);padding:18px;position:relative;overflow:hidden}
.hero .big{font-size:64px;line-height:1}
.bar{height:6px;background:color-mix(in srgb,var(--bg) 25%,transparent);margin-top:12px}.bar i{display:block;height:100%;background:var(--acc);transition:width .5s cubic-bezier(.2,.9,.2,1.3)}
.next{margin-top:14px;border:2px solid var(--ink);padding:16px;background:var(--card)}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:48px;border:0;font-weight:800;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.p{background:var(--acc);color:var(--accInk)}.s{background:none;border:2px solid var(--ink);color:var(--ink)}
.meal{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.dot{width:44px;height:44px;border:2px solid var(--ink);background:none;color:var(--ink);font-size:20px;cursor:pointer;transition:transform .2s}
.dot[aria-pressed=true]{background:var(--acc);color:var(--accInk);border-color:var(--acc);transform:rotate(-8deg)}
.meal small{display:block;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;transition:transform .3s}
.toast.show{transform:translate(-50%,0)}.toast button{min-height:44px;background:var(--acc);border:0;font-weight:800;padding:0 14px;cursor:pointer}
:focus-visible{outline:3px solid var(--off);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="kick">Lun 23 nov</span><button class="chip" id="theme" aria-label="Cambia tema">Tema</button></div>
  <h1>Oggi si <span>spinge</span></h1>
  <div class="top"><span class="kick">Giorno</span><button class="chip"><b>ON</b> · auto</button></div>
  <section class="hero" style="margin-top:14px">
    <div class="kick" style="color:inherit;opacity:.7">Giornata</div>
    <div class="num big" id="pct">0%</div>
    <div class="bar"><i id="bar" style="width:0"></i></div>
  </section>
  <section class="next">
    <div class="kick">Prossimo · 12:30</div>
    <div class="num" style="font-size:28px">PRANZO</div>
    <div style="color:var(--mut)">Riso basmati 80 g + pollo 150 g + verdure</div>
    <div class="row"><button class="btn p" data-eat="1">✓ Mangiato</button><button class="btn s">Sostituisci</button></div>
  </section>
  <div id="list" style="margin-top:12px"></div>
</div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo">Annulla</button></div>
<script>
const meals=[["Colazione","07:30","Yogurt greco + avena"],["Pranzo","12:30","Riso, pollo, verdure"],["Spuntino","16:30","Frutta + mandorle"],["Cena","20:00","Salmone, patate"]];
const done=new Set([0]);let last;
const render=()=>{list.innerHTML=meals.map(([n,t,d],i)=>`<div class="meal"><button class="dot" aria-pressed="${done.has(i)}" aria-label="${done.has(i)?"Annulla":"Segna mangiato"} ${n}" data-i="${i}">${done.has(i)?"✓":"+"}</button><div><b>${n}</b><small>${d}</small></div><span class="num">${t}</span></div>`).join("");const p=Math.round(100*done.size/meals.length);pct.textContent=p+"%";bar.style.width=p+"%"};
const toggle=i=>{done.has(i)?done.delete(i):done.add(i);last=i;render();tmsg.textContent=(done.has(i)?"Segnato: ":"Annullato: ")+meals[i][0];toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove("show"),4000)};
document.onclick=e=>{const b=e.target.closest("[data-i],[data-eat]");if(b)toggle(+(b.dataset.i??b.dataset.eat))};
undo.onclick=()=>{toggle(last);toast.classList.remove("show")};
theme.onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";
render();
</script>
</body>
</html>
