<!doctype html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direzione B · Mattino</title>
<style>
/* Direzione B "Mattino": calda, morbida, da diario. Carta crema, terracotta e salvia, titoli serif. */
:root{--bg:#f6f1e8;--card:#fffdf8;--ink:#2b2420;--mut:#6e6259;--line:#e7ddcf;--acc:#b8532f;--sage:#5f7d63;--soft:#efe5d6}
[data-theme=dark]{--bg:#1b1715;--card:#25201d;--ink:#f3ece3;--mut:#bcae9f;--line:#3a322d;--acc:#e98a63;--sage:#9cc0a0;--soft:#302824}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.wrap{max-width:420px;margin:auto;padding:24px 18px 110px}
.top{display:flex;justify-content:space-between;align-items:center}
.date{color:var(--mut);font-size:14px}
h1{font-size:36px;font-weight:500;margin:4px 0 18px;line-height:1.1}h1 em{color:var(--acc)}
.pill{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;cursor:pointer}
.pill b{color:var(--sage)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgb(80 50 30/.35);margin-top:14px}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--sage) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;transition:--p .6s}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px}
.next{background:var(--soft)}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:48px;border-radius:16px;border:0;font-weight:600;font-size:15px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}.p{background:var(--acc);color:#fff}.s{background:var(--card);color:var(--ink);border:1px solid var(--line)}
[data-theme=dark] .p{color:#1b1715}
.meal{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 0}
.meal+.meal{border-top:1px dashed var(--line)}
.dot{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-size:18px;cursor:pointer;transition:background .25s,transform .25s}
.dot[aria-pressed=true]{background:var(--sage);color:var(--card);border-color:var(--sage);transform:scale(1.06)}
.meal small{display:block;color:var(--mut)}.time{color:var(--mut);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0)}.toast button{min-height:44px;border-radius:12px;background:var(--acc);color:#fff;border:0;padding:0 14px;font-weight:600;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="date">Lunedì 23 novembre</span><button class="pill" id="theme" aria-label="Cambia tema">◐</button></div>
  <h1 class="serif">Buongiorno.<br><em>Un passo alla volta.</em></h1>
  <button class="pill">Giorno <b>ON</b> · automatico</button>
  <section class="card ringwrap">
    <div class="ring" id="ring"><span class="serif" id="pct">0%</span></div>
    <div><div class="serif" style="font-size:20px">La tua giornata</div><div class="date" id="sub"></div></div>
  </section>
  <section class="card next">
    <div class="date">Prossimo pasto · 12:30</div>
    <div class="serif" style="font-size:24px">Pranzo</div>
    <div style="color:var(--mut)">Riso basmati 80 g, pollo 150 g e verdure</div>
    <div class="row"><button class="btn p" data-eat="1">Mangiato</button><button class="btn s">Sostituisci</button></div>
  </section>
  <section class="card" id="list"></section>
</div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo">Annulla</button></div>
<script>
const meals=[["Colazione","07:30","Yogurt greco e avena"],["Pranzo","12:30","Riso, pollo, verdure"],["Spuntino","16:30","Frutta e mandorle"],["Cena","20:00","Salmone e patate"]];
const done=new Set([0]);let last;
const render=()=>{list.innerHTML=meals.map(([n,t,d],i)=>`<div class="meal"><button class="dot" aria-pressed="${done.has(i)}" aria-label="${done.has(i)?"Annulla":"Segna mangiato"} ${n}" data-i="${i}">${done.has(i)?"✓":"○"}</button><div><b>${n}</b><small>${d}</small></div><span class="time">${t}</span></div>`).join("");const p=Math.round(100*done.size/meals.length);pct.textContent=p+"%";ring.style.setProperty("--p",p);sub.textContent=`${done.size} di ${meals.length} pasti · 1 integratore da prendere`};
const toggle=i=>{done.has(i)?done.delete(i):done.add(i);last=i;render();tmsg.textContent=(done.has(i)?"Segnato ":"Annullato ")+meals[i][0].toLowerCase();toast.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>toast.classList.remove("show"),4000)};
document.onclick=e=>{const b=e.target.closest("[data-i],[data-eat]");if(b)toggle(+(b.dataset.i??b.dataset.eat))};
undo.onclick=()=>{toggle(last);toast.classList.remove("show")};
theme.onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";
render();
</script>
</body>
</html>
