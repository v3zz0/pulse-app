# PULSE in produzione, avviato da Jenkins. L'HTTPS lo fa un reverse proxy davanti (es. Nginx Proxy Manager).
# Le porte sono pubblicate solo sull'IP LAN della VM (PULSE_BIND_IP), mai su 0.0.0.0.
name: pulse-production
x-logging: &logging
  driver: local
  options: {max-size: "10m", max-file: "3"}
x-common: &common
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging: *logging
services:
  postgres:
    <<: *common
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Configura DATABASE_NAME}
      POSTGRES_USER: pulse_maintenance
      POSTGRES_PASSWORD: ${PG_MAINTENANCE_PASSWORD:?Configura password manutenzione PostgreSQL}
      PULSE_APP_DB_USER: ${DATABASE_USERNAME:?}
      PULSE_APP_DB_PASSWORD: ${DATABASE_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/10-pulse-roles.sh:/docker-entrypoint-initdb.d/10-pulse-roles.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
  strapi:
    <<: *common
    image: pulse-strapi-production:${PULSE_IMAGE_TAG:-local}
    build:
      context: ./backend
      args: {PUBLIC_API_URL: "https://apipulse.vezzo.vp360web.it"}
    environment:
      NODE_ENV: production
      PULSE_ENV: production
      PUBLIC_ORIGIN: https://pulse.vezzo.vp360web.it
      PUBLIC_API_URL: https://apipulse.vezzo.vp360web.it
      CORS_ORIGINS: https://pulse.vezzo.vp360web.it,https://apipulse.vezzo.vp360web.it
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STRAPI_TELEMETRY_DISABLED: 'true'
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
      APP_KEYS: ${APP_KEYS:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      JWT_SECRET: ${JWT_SECRET:?}
    # Solo per il pannello admin (apipulse.*): NPM lo limita al tuo IP con una Access List.
    ports: ['${PULSE_BIND_IP:?}:${PULSE_API_PORT:?}:1337']
    volumes: [uploads:/app/public/uploads]
    networks: [database, application, edge]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:1337/_health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 2g
  frontend:
    <<: *common
    image: pulse-frontend-production:${PULSE_IMAGE_TAG:-local}
    build: ./frontend
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    ports: ['${PULSE_BIND_IP:?}:${PULSE_FRONTEND_PORT:?}:80']
    networks: [application, edge]
    depends_on: {strapi: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
networks:
  database: {internal: true}
  application: {internal: true}
  edge: {}
volumes:
  postgres_data:
  uploads:
